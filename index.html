<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Menú semanal del hogar con raciones ajustadas para cada persona.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menú">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Menú semanal de casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F4F6FB; --ink:#16182B; --muted:#6B7088; --line:#E3E6EF;
  --leaf:#10B26C; --leaf-soft:#DDF7EA;
  --h:#2563FF; --h-soft:#E1EAFF; --e:#F0328A; --e-soft:#FFE1EF;
  --warn:#E06C00; --warn-soft:#FFF0DC;
  --s-d:#FFB020; --s-d-soft:#FFF4DA; --s-m1:#00B8C8; --s-m1-soft:#DDF7F9;
  --s-a:#10B26C; --s-a-soft:#DDF7EA; --s-m2:#8B5CF6; --s-m2-soft:#EEE7FF;
  --s-c:#FF5A3C; --s-c-soft:#FFE6E0;
  --navh:64px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#12131E; --surface:#1D1F2E; --ink:#F1F2F8; --muted:#A3A7BD; --line:#2D3044;
  --h-soft:#1E2A4D; --e-soft:#40182C; --leaf-soft:#123526; --warn-soft:#3A2410;
  --s-d-soft:#3A2D10; --s-m1-soft:#0F3236; --s-a-soft:#123526; --s-m2-soft:#2A2047; --s-c-soft:#3D1D16;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;margin:0;line-height:1.15}
.wrap{max-width:480px;margin:0 auto;padding:12px 14px calc(var(--navh) + env(safe-area-inset-bottom,0px) + 24px)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 2px}
header.top h1{font-size:1.75rem;font-weight:800;letter-spacing:-.02em}
header.top p{display:none}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.person{border-radius:18px;padding:12px 14px;background:var(--c);color:#fff;box-shadow:0 6px 16px -8px var(--c)}
.person b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem}
.person small{display:block;opacity:.92;font-size:.82rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px -14px rgba(22,24,43,.35)}
nav.tabs button{flex:1;max-width:96px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.72rem;font-weight:700;padding:6px 2px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--leaf);background:var(--leaf-soft)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--h);outline-offset:2px}
.days{display:flex;gap:6px;margin:12px -14px 14px;padding:2px 14px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:8px;padding-bottom:8px}
.days::-webkit-scrollbar{display:none}
.days button{flex:1 0 46px;border:0;background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 0;font:inherit;font-weight:700;cursor:pointer;line-height:1.1;min-height:52px}
.days button span{display:block;font-size:.68rem;color:var(--muted);font-weight:400;margin-top:2px}
.days button[aria-pressed="true"]{background:var(--leaf);color:#fff}
.days button[aria-pressed="true"] span{color:#fff;opacity:.9}
.dayhead h2{font-size:1.5rem;font-weight:800}
.meal{background:var(--sc-soft);border-radius:18px;padding:12px 14px;margin:10px 0;border-left:6px solid var(--sc)}
.meal .slot{font-size:.8rem;color:var(--sc);font-weight:700;filter:brightness(.85)}
.meal select{width:100%;font:inherit;font-size:1.02rem;font-weight:700;color:var(--ink);background:var(--bg);border:0;border-radius:12px;padding:10px 12px;margin:6px 0 10px;appearance:none;cursor:pointer;min-height:44px}
.portions{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.82rem;padding:4px 10px;border-radius:999px;background:var(--c);color:#fff;font-weight:700}
.meal details{margin-top:8px}
.meal summary{cursor:pointer;color:var(--ink);font-size:.88rem;font-weight:700;padding:6px 0}
table.ing{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:4px;background:var(--bg);border-radius:12px;overflow:hidden}
table.ing th{text-align:right;font-weight:700;padding:6px;font-size:.76rem}
table.ing th:first-child,table.ing td:first-child{text-align:left}
table.ing td{padding:6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.totals{background:var(--surface);border-radius:18px;padding:14px;margin:16px 0}
.totals h3{font-size:1.1rem;margin-bottom:6px}
.bar{margin:9px 0}
.bar .lbl{display:flex;justify-content:space-between;font-size:.86rem}
.bar .track{height:12px;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:4px}
.bar .fill{height:100%;background:var(--c);border-radius:999px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{flex:1 1 auto;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--leaf);color:#fff;min-height:48px}
.btn.ghost{background:var(--surface);color:var(--ink)}
.note{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:11px 13px;font-size:.88rem;margin:10px 0}
.note b{color:var(--warn)}
.filters{display:flex;gap:6px;margin:12px -14px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;border:0;background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rec{background:var(--sc-soft,var(--surface));border-left:6px solid var(--sc,var(--line));border-radius:16px;padding:12px 14px;margin:8px 0}
.rec h3{font-size:1.02rem}
.rec .mac{color:var(--muted);font-size:.84rem;margin:2px 0 6px}
.rec .ingl{font-size:.86rem}
.shop h3{font-size:1.1rem;margin:18px 0 6px}
.shop label{display:flex;align-items:center;gap:12px;background:var(--surface);padding:12px;border-radius:14px;margin:6px 0;cursor:pointer;min-height:50px}
.shop label input{width:22px;height:22px;accent-color:var(--leaf);flex:none}
.shop label .q{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.shop label.done{opacity:.55}
.shop label.done span:first-of-type{text-decoration:line-through}
.card{background:var(--surface);border-radius:18px;padding:14px;margin:12px 0}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 120px}
.field label{font-size:.82rem;color:var(--muted);font-weight:700}
.field input{font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:46px}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:10px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
.chart{width:100%;margin-top:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stats div{background:var(--bg);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem}
.stats small{color:var(--muted)}
ul.wl{list-style:none;padding:0;margin:10px 0 0;font-size:.92rem}
ul.wl li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
ul.wl button{border:0;background:transparent;color:var(--e);cursor:pointer;font:inherit;font-weight:700;padding:6px}
.precs h3{font-size:1.05rem;margin:12px 0 4px}
.precs ul{margin:4px 0;padding-left:20px;font-size:.92rem}
.precs li{margin:4px 0}
.theme{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:2px}
.theme button{border:0;background:transparent;color:var(--muted);width:40px;height:36px;border-radius:999px;cursor:pointer;display:grid;place-items:center}
.theme button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
:root[data-theme="dark"] nav.tabs{box-shadow:none}
:root[data-theme="dark"] .person{box-shadow:none}
.sec{font-size:1.05rem;margin:18px 0 0}
.status{font-size:.78rem;color:var(--muted);text-align:center;margin-top:20px}
@media (prefers-reduced-motion:no-preference){.bar .fill{transition:width .4s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Menú semanal</h1>
    <div class="theme" role="group" aria-label="Tema">
      <button data-theme-set="light" aria-pressed="true" aria-label="Fondo claro"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button data-theme-set="dark" aria-pressed="false" aria-label="Fondo oscuro"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    </div>
    <p>Mismo plato para los dos; la ración se ajusta a lo que necesita cada uno.</p>
  </header>
  <div class="people" id="people"></div>
    <main id="view"></main>
  <p class="status" id="status">Cargando…</p>
</div>
<nav class="tabs" role="tablist" id="tabs"><button role="tab" data-tab="semana" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Semana</span></button><button role="tab" data-tab="recetas" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg><span>Recetas</span></button><button role="tab" data-tab="compra" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.5 12h-11zM9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Compra</span></button><button role="tab" data-tab="peso" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg><span>Peso</span></button><button role="tab" data-tab="ajustes" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Ajustes</span></button></nav>

<script>
// ---------- Datos ----------
const RAW = `
d1|Avena con yogur, plátano y nueces|d|437|16|62|14|Copos de avena:50;Yogur natural desnatado:150;Plátano:100;Nueces:15
d2|Tostadas con tomate, AOVE y huevos revueltos|d|409|24|34|20|Pan integral:70;Tomate:80;Aceite de oliva virgen extra:7;Huevo:2u
d3|Tortilla de claras con pan y naranja|d|325|25|38|7|Huevo:1u;Claras de huevo:100;Pan integral:50;Naranja:150
d4|Queso batido con frutos rojos, avena y nueces|d|343|27|40|8|Queso fresco batido 0%:250;Frutos rojos:120;Copos de avena:30;Nueces:8
d5|Tostada de aguacate con huevo cocido|d|438|23|38|22|Pan integral:70;Aguacate:60;Huevo:2u;Tomate:50
d6|Batido de leche, plátano, avena y cacahuete|d|408|17|56|14|Leche semidesnatada:250;Plátano:100;Copos de avena:30;Crema de cacahuete 100%:15
m1|Yogur griego con nueces|m|208|16|8|13|Yogur griego 2%:150;Nueces:15
m2|Manzana y almendras|m|210|5|27|10|Manzana:180;Almendras naturales:20
m3|Tortitas de arroz con queso fresco y tomate|m|136|12|20|1|Tortitas de arroz:18;Queso fresco de Burgos 0% (pasteurizado):80;Tomate:50
m4|Hummus con zanahoria y pepino|m|224|6|23|12|Hummus:60;Zanahoria:100;Pepino:100
m5|Kéfir con plátano|m|209|8|32|6|Kéfir natural:200;Plátano:100
m6|Queso batido con manzana y canela|m|170|17|28|1|Queso fresco batido 0%:200;Manzana:150
a1|Pollo al horno con papas y ensalada|a|432|41|39|14|Pechuga de pollo:150;Papas:200;Aceite de oliva virgen extra:10;Lechuga:80;Tomate:70
a2|Lentejas estofadas con verduras|a|378|18|49|11|Lentejas secas:70;Zanahoria:60;Pimiento:50;Cebolla:50;Aceite de oliva virgen extra:10
a3|Salmón al horno con arroz integral y brócoli|a|615|35|59|25|Salmón:130;Arroz integral:70;Brócoli:150;Aceite de oliva virgen extra:5
a4|Garbanzos con espinacas y huevo|a|441|25|41|20|Garbanzos cocidos:200;Espinacas:150;Huevo:1u;Aceite de oliva virgen extra:10;Ajo:5
a5|Ternera salteada con verduras y arroz integral|a|585|39|66|19|Ternera magra:150;Arroz integral:70;Pimiento:100;Cebolla:50;Calabacín:100;Aceite de oliva virgen extra:10
a6|Merluza a la plancha con papas y mojo verde casero|a|436|40|40|13|Merluza:200;Papas:200;Aceite de oliva virgen extra:10;Cilantro:10;Ajo:5;Lechuga:100
a7|Pasta integral con pollo, tomate y albahaca|a|510|41|58|12|Pasta integral:80;Pechuga de pollo:120;Tomate triturado:150;Aceite de oliva virgen extra:7
a8|Potaje de alubias y verduras|a|450|18|72|11|Alubias cocidas:150;Calabaza:100;Judías verdes:80;Zanahoria:60;Papas:100;Aceite de oliva virgen extra:10
a9|Pavo a la plancha con quinoa y verduras asadas|a|523|45|48|16|Pechuga de pavo:150;Quinoa:60;Berenjena:70;Calabacín:70;Pimiento:60;Aceite de oliva virgen extra:10
a10|Sardinas al horno con ensalada de tomate y pan|a|452|37|30|21|Sardinas frescas:150;Tomate:150;Cebolla:30;Aceite de oliva virgen extra:10;Pan integral:50
c1|Tortilla de calabacín con ensalada|c|312|21|13|18|Huevo:2u;Claras de huevo:60;Calabacín:150;Cebolla:50;Aceite de oliva virgen extra:7;Lechuga:100
c2|Crema de calabaza y pollo a la plancha|c|358|31|38|10|Calabaza:250;Puerro:60;Papas:80;Aceite de oliva virgen extra:7;Pechuga de pollo:120
c3|Dorada al horno con verduras|c|348|40|14|14|Dorada (filetes):200;Pimiento:100;Cebolla:80;Tomate:100;Aceite de oliva virgen extra:10
c4|Wrap integral de pollo y verduras|c|345|31|37|8|Tortilla de trigo integral:60;Pechuga de pollo:100;Lechuga:40;Tomate:60;Pimiento:50;Yogur natural desnatado:50
c5|Revuelto de champiñones y gambas con pan|c|434|44|22|18|Gambas peladas:120;Huevo:2u;Champiñones:150;Ajo:5;Aceite de oliva virgen extra:5;Pan integral:40
c6|Hamburguesa casera de ternera con boniato|c|358|31|35|12|Carne picada de ternera 5%:130;Boniato:150;Aceite de oliva virgen extra:5;Lechuga:80;Tomate:70
c7|Salteado de tofu con verduras y arroz integral|c|458|26|49|17|Tofu firme:150;Arroz integral:50;Brócoli:100;Zanahoria:60;Aceite de oliva virgen extra:5;Salsa de soja baja en sal:5
c8|Bacalao fresco en papillote con papa|c|358|39|29|9|Bacalao fresco:200;Papas:150;Calabacín:100;Aceite de oliva virgen extra:7`;

const RECIPES = RAW.trim().split("\n").map(l=>{
  const [id,n,t,k,p,c,g,ing]=l.split("|");
  return {id,n,t,k:+k,p:+p,c:+c,g:+g,ing:ing.split(";").map(s=>{const [name,q]=s.split(":");return {name,q:parseFloat(q),u:q.endsWith("u")?"u":"g"}})};
});
const BYID = Object.fromEntries(RECIPES.map(r=>[r.id,r]));
const CATS = {
  "Fruta y verdura":["Plátano","Tomate","Naranja","Frutos rojos","Aguacate","Manzana","Zanahoria","Pepino","Lechuga","Pimiento","Cebolla","Brócoli","Espinacas","Ajo","Calabacín","Cilantro","Calabaza","Judías verdes","Papas","Berenjena","Puerro","Champiñones","Boniato"],
  "Carne y pescado":["Pechuga de pollo","Salmón","Ternera magra","Merluza","Pechuga de pavo","Sardinas frescas","Dorada (filetes)","Gambas peladas","Carne picada de ternera 5%","Bacalao fresco"],
  "Lácteos, huevos y tofu":["Yogur natural desnatado","Huevo","Claras de huevo","Queso fresco batido 0%","Leche semidesnatada","Yogur griego 2%","Queso fresco de Burgos 0% (pasteurizado)","Kéfir natural","Tofu firme"]
};
const catOf = n => Object.keys(CATS).find(c=>CATS[c].includes(n)) || "Despensa";
const SLOTS = [["d","Desayuno","d"],["m1","Media mañana","m"],["a","Almuerzo","a"],["m2","Merienda","m"],["c","Cena","c"]];
const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const TYPE_NAMES = {d:"Desayunos",m:"Tentempiés",a:"Almuerzos",c:"Cenas"};

function autoWeek(seed=0){
  const by = t => RECIPES.filter(r=>r.t===t).map(r=>r.id);
  const shuffle = a => {a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a};
  const pick = seed ? shuffle : (a=>a);
  const d=pick(by("d")), m=pick(by("m")), a=pick(by("a")), c=pick(by("c"));
  return DAYS.map((_,i)=>({d:d[i%d.length],m1:m[(i*2)%m.length],a:a[i%a.length],m2:m[(i*2+1)%m.length],c:c[i%c.length]}));
}

const DEFAULT = {
  people:{h:{name:"Héctor",kcal:2150,prot:150},e:{name:"Yasmin",kcal:1900,prot:100}},
  week:autoWeek(0), checked:{}, weights:{h:[],e:[]}
};

// ---------- Estado y guardado ----------
let S = JSON.parse(JSON.stringify(DEFAULT));
let ui = {tab:"semana", day:(new Date().getDay()+6)%7, filter:"all", wp:"h"};
let saveTimer = null;
const LS_KEY = "menu-semanal-v1";
const status = t => document.getElementById("status").textContent = t;

function merge(saved){
  S = Object.assign(JSON.parse(JSON.stringify(DEFAULT)), saved||{});
  S.people = {h:{...DEFAULT.people.h,...(saved?.people?.h||{})}, e:{...DEFAULT.people.e,...(saved?.people?.e||{})}};
  S.weights = {h:saved?.weights?.h||[], e:saved?.weights?.e||[]};
  if(S.people.e.name==="Ella") S.people.e.name="Yasmin";
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); status("Guardado en este móvil"); }
    catch(e){ status("No se ha podido guardar: revisa el espacio del navegador"); }
  },400);
}
async function init(){
  try{ const ls = localStorage.getItem(LS_KEY); if(ls) merge(JSON.parse(ls)); }catch(e){}
  render();
  status("Datos guardados en este móvil");
}

// ---------- Cálculos ----------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function dayBase(i){ const w=S.week[i]; let k=0,p=0; SLOTS.forEach(([s])=>{const r=BYID[w[s]]; if(r){k+=r.k;p+=r.p}}); return {k,p}; }
function factor(i,who){ const b=dayBase(i); return b.k ? clamp(S.people[who].kcal/b.k,0.6,1.8) : 1; }
function fmtQ(q,u){ return u==="u" ? (Math.round(q*2)/2).toString().replace(".",",")+" ud" : Math.round(q/5)*5+" g"; }
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------- Render ----------
function renderPeople(){
  const el=document.getElementById("people");
  el.innerHTML = ["h","e"].map(w=>{const p=S.people[w];return `<div class="person" style="--c:var(--${w})"><b>${esc(p.name)}</b><small>${p.kcal} kcal · ${p.prot} g proteína/día</small></div>`}).join("");
}
function render(){
  renderPeople();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===ui.tab));
  ({semana:viewWeek,recetas:viewRecipes,compra:viewShop,peso:viewWeight,ajustes:viewSettings})[ui.tab]();
}

function viewWeek(){
  const i=ui.day, w=S.week[i], fh=factor(i,"h"), fe=factor(i,"e");
  const daysHtml = DAYS.map((d,j)=>`<button aria-pressed="${j===i}" data-day="${j}">${d.slice(0,2)}<span>${dayBase(j).k||"—"}</span></button>`).join("");
  const opts = (t,sel)=>{
    const groups = t==="m"?["m"]:t==="d"?["d"]:t==="a"?["a","c"]:["c","a"];
    return `<option value="">— Sin asignar —</option>`+groups.map(g=>`<optgroup label="${TYPE_NAMES[g]}">${RECIPES.filter(r=>r.t===g).map(r=>`<option value="${r.id}" ${r.id===sel?"selected":""}>${esc(r.n)} (${r.k} kcal)</option>`).join("")}</optgroup>`).join("");
  };
  const meals = SLOTS.map(([s,label,t])=>{
    const r=BYID[w[s]];
    const detail = r ? `
      <div class="portions">
        <span class="chip" style="--c:var(--h)">${esc(S.people.h.name)} ×${fh.toFixed(2).replace(".",",")} · ${Math.round(r.k*fh)} kcal</span>
        <span class="chip" style="--c:var(--e)">${esc(S.people.e.name)} ×${fe.toFixed(2).replace(".",",")} · ${Math.round(r.k*fe)} kcal</span>
      </div>
      <details><summary>Ingredientes por persona</summary>
        <table class="ing"><thead><tr><th>Ingrediente</th><th style="color:var(--h)">${esc(S.people.h.name)}</th><th style="color:var(--e)">${esc(S.people.e.name)}</th><th>Total</th></tr></thead>
        <tbody>${r.ing.map(x=>`<tr><td>${esc(x.name)}</td><td>${fmtQ(x.q*fh,x.u)}</td><td>${fmtQ(x.q*fe,x.u)}</td><td>${fmtQ(x.q*(fh+fe),x.u)}</td></tr>`).join("")}</tbody></table>
      </details>` : `<p style="margin:0;color:var(--muted);font-size:.9rem">Elige un plato para este hueco.</p>`;
    return `<div class="meal" style="--sc:var(--s-${s});--sc-soft:var(--s-${s}-soft)"><div class="slot">${label}</div><select data-slot="${s}" aria-label="${label}">${opts(t,w[s])}</select>${detail}</div>`;
  }).join("");
  const bars = ["h","e"].map(who=>{
    const f=factor(i,who), b=dayBase(i), p=S.people[who];
    const k=Math.round(b.k*f), pr=Math.round(b.p*f);
    return `<div class="bar" style="--c:var(--${who})"><div class="lbl"><span><b>${esc(p.name)}</b> · energía</span><span>${k} / ${p.kcal} kcal</span></div><div class="track"><div class="fill" style="width:${Math.min(100,k/p.kcal*100)}%"></div></div></div>
    <div class="bar" style="--c:var(--${who})"><div class="lbl"><span>Proteína</span><span>${pr} / ${p.prot} g</span></div><div class="track"><div class="fill" style="width:${Math.min(100,pr/p.prot*100)}%"></div></div></div>`;
  }).join("");
  const clampNote = (fh===1.8||fh===0.6||fe===1.8||fe===0.6) && dayBase(i).k ? `<div class="note"><b>Ojo:</b> las raciones de hoy están en su límite. Añade o quita un plato para cuadrar mejor el día.</div>` : "";
  const protLow = ["h","e"].filter(who=>Math.round(dayBase(i).p*factor(i,who)) < S.people[who].prot*0.9);
  const protNote = protLow.length && dayBase(i).k ? `<div class="note"><b>Proteína justa</b> para ${protLow.map(w=>esc(S.people[w].name)).join(" y ")}. Cambia un tentempié por uno con queso batido o yogur griego.</div>` : "";
  document.getElementById("view").innerHTML = `
    <div class="days" role="group" aria-label="Día de la semana">${daysHtml}</div>
    <div class="dayhead"><h2>${DAYS[i]}</h2></div>
    ${meals}
    <div class="totals"><h3>Total del día</h3>${bars}</div>
    ${clampNote}${protNote}
    <div class="row"><button class="btn" id="auto">Rellenar semana al azar</button><button class="btn ghost" id="clearDay">Vaciar ${DAYS[i].toLowerCase()}</button></div>`;
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ui.day=+b.dataset.day;render()});
  document.querySelectorAll("select[data-slot]").forEach(sel=>sel.onchange=()=>{S.week[i][sel.dataset.slot]=sel.value;save();render()});
  document.getElementById("auto").onclick=()=>{ if(confirm("¿Rellenar los 7 días con platos nuevos? Se sustituye lo que tengas.")){S.week=autoWeek(1);S.checked={};save();render()} };
  document.getElementById("clearDay").onclick=()=>{S.week[i]={d:"",m1:"",a:"",m2:"",c:""};save();render()};
}

function viewRecipes(){
  const f=ui.filter;
  const list = RECIPES.filter(r=>f==="all"||r.t===f);
  document.getElementById("view").innerHTML = `
    <div class="filters" role="group" aria-label="Filtrar">${[["all","Todas"],["d","Desayunos"],["m","Tentempiés"],["a","Almuerzos"],["c","Cenas"]].map(([k,l])=>`<button data-f="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>
    <p style="color:var(--muted);font-size:.9rem;margin:0">Cantidades de una ración base. En la semana se escalan para cada uno.</p>
    ${list.map(r=>`<div class="rec" style="--sc:var(--s-${({d:"d",m:"m1",a:"a",c:"c"})[r.t]});--sc-soft:var(--s-${({d:"d",m:"m1",a:"a",c:"c"})[r.t]}-soft)"><h3>${esc(r.n)}</h3><div class="mac">${r.k} kcal · P ${r.p} g · HC ${r.c} g · G ${r.g} g</div><div class="ingl">${r.ing.map(x=>`${esc(x.name)} ${fmtQ(x.q,x.u)}`).join(" · ")}</div></div>`).join("")}`;
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ui.filter=b.dataset.f;render()});
}

function viewShop(){
  const tot={};
  S.week.forEach((w,i)=>{const fs=factor(i,"h")+factor(i,"e"); SLOTS.forEach(([s])=>{const r=BYID[w[s]]; if(!r)return; r.ing.forEach(x=>{tot[x.name]=tot[x.name]||{q:0,u:x.u}; tot[x.name].q+=x.q*fs;})})});
  const names=Object.keys(tot);
  if(!names.length){document.getElementById("view").innerHTML=`<div class="card">La semana está vacía. Ve a <b>Semana</b> y elige platos para generar la lista.</div>`;return;}
  const groups={}; names.forEach(n=>{(groups[catOf(n)]=groups[catOf(n)]||[]).push(n)});
  const order=["Fruta y verdura","Carne y pescado","Lácteos, huevos y tofu","Despensa"];
  const fmtShop=(q,u)=>u==="u"?Math.ceil(q)+" ud":(q>=1000?(Math.round(q/50)*50/1000).toString().replace(".",",")+" kg":Math.ceil(q/10)*10+" g");
  const left = names.filter(n=>!S.checked[n]).length;
  document.getElementById("view").innerHTML = `
    <p style="margin:8px 0;color:var(--muted)">Para los dos, toda la semana. Te faltan ${left} de ${names.length}.</p>
    <div class="shop">${order.filter(c=>groups[c]).map(c=>`<h3>${c}</h3>${groups[c].sort((a,b)=>a.localeCompare(b,"es")).map(n=>`<label class="${S.checked[n]?"done":""}"><input type="checkbox" data-n="${esc(n)}" ${S.checked[n]?"checked":""}><span>${esc(n)}</span><span class="q">${fmtShop(tot[n].q,tot[n].u)}</span></label>`).join("")}`).join("")}</div>
    <div class="row"><button class="btn ghost" id="uncheck">Desmarcar todo</button></div>
    <p style="color:var(--muted);font-size:.85rem">Pesos en crudo. Las papas y la fruta, con piel. Compra el pescado fresco para los primeros días o congélalo.</p>`;
  document.querySelectorAll("[data-n]").forEach(c=>c.onchange=()=>{S.checked[c.dataset.n]=c.checked;save();render()});
  document.getElementById("uncheck").onclick=()=>{S.checked={};save();render()};
}

function lineChart(list,key,who,unit){
  if(list.length<2) return "";
  const W=640,H=200,pad=34, ks=list.map(x=>x[key]), mn=Math.min(...ks)-0.5, mx=Math.max(...ks)+0.5;
  const t0=new Date(list[0].d), span=Math.max(1,new Date(list[list.length-1].d)-t0);
  const pts=list.map(x=>[pad+(new Date(x.d)-t0)/span*(W-pad*2), H-pad-(x[key]-mn)/(mx-mn)*(H-pad*2)]);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución en ${unit}">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"/>
    <text x="4" y="${pad}" fill="var(--muted)" font-size="13">${mx.toFixed(1)}</text><text x="4" y="${H-pad}" fill="var(--muted)" font-size="13">${mn.toFixed(1)}</text>
    <polyline fill="none" stroke="var(--${who})" stroke-width="3" stroke-linejoin="round" points="${pts.map(q=>q.join(",")).join(" ")}"/>
    ${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4.5" fill="var(--${who})"/>`).join("")}</svg></div>`;
}
const n1 = v => v.toFixed(1).replace(".",",");
const sgn = v => (v>0?"+":"")+n1(v);

function viewWeight(){
  const who=ui.wp, p=S.people[who], all=[...S.weights[who]].sort((a,b)=>a.d.localeCompare(b.d));
  const list=all.filter(x=>typeof x.kg==="number"), wl=all.filter(x=>typeof x.cm==="number");
  const today=new Date().toISOString().slice(0,10);
  let wHtml="", cHtml="";
  if(list.length){
    const first=list[0], last=list[list.length-1];
    const days=(new Date(last.d)-new Date(first.d))/864e5;
    const rate = days>=7 ? (last.kg-first.kg)/(days/7) : null;
    const goal = who==="h" ? `<div style="grid-column:1/-1"><small>Objetivo de pérdida (7–10 % del peso inicial)</small><b>${n1(first.kg*0.93)} – ${n1(first.kg*0.90)} kg</b><small>${Math.max(0,Math.min(100,(first.kg-last.kg)/(first.kg*0.07)*100)).toFixed(0)} % del primer tramo conseguido</small></div>` : "";
    wHtml=`<h3 class="sec">Peso</h3><div class="stats">${goal}<div><small>Inicio</small><b>${n1(first.kg)} kg</b></div><div><small>Actual</small><b>${n1(last.kg)} kg</b></div><div><small>Cambio</small><b>${sgn(last.kg-first.kg)} kg</b></div><div><small>Ritmo</small><b>${rate===null?"—":(rate>0?"+":"")+rate.toFixed(2).replace(".",",")+" kg/sem"}</b></div></div>${lineChart(list,"kg",who,"kg")}`;
  }
  if(wl.length){
    const first=wl[0], last=wl[wl.length-1];
    const ref = who==="h" ? {ok:94,hi:102} : {ok:80,hi:88};
    const zone = last.cm<ref.ok ? "Zona saludable" : last.cm<ref.hi ? "Riesgo aumentado" : "Riesgo alto";
    cHtml=`<h3 class="sec">Cintura</h3><div class="stats"><div><small>Inicio</small><b>${n1(first.cm)} cm</b></div><div><small>Actual</small><b>${n1(last.cm)} cm</b></div><div><small>Cambio</small><b>${sgn(last.cm-first.cm)} cm</b></div><div><small>Referencia</small><b style="font-size:1rem">${zone}</b><small>sana &lt; ${ref.ok} cm</small></div></div>${lineChart(wl,"cm",who,"cm")}`;
  }
  const advice = who==="h"
    ? `<div class="note"><b>Ritmo sano:</b> entre 0,25 y 0,5 kg por semana. Si bajas más rápido, sube unas 150 kcal en Ajustes para no perder músculo. Pésate en ayunas, mismo día de la semana.</div>
       <div class="note"><b>La cintura manda:</b> con tu masa muscular, la cintura refleja mejor que el peso la grasa abdominal, que es la que mueve el índice de hígado graso y la resistencia a la insulina. Mídela cada dos semanas a la altura del ombligo, de pie, tras soltar el aire.</div>`
    : `<div class="note"><b>Durante la FIV</b>, para ${esc(p.name)} el objetivo es mantener peso y comer bien, no bajar. Si el peso baja de forma continuada, sube las kcal en Ajustes y coméntalo con el equipo médico.</div>`;
  const fmtE = x => [typeof x.kg==="number"?n1(x.kg)+" kg":"", typeof x.cm==="number"?n1(x.cm)+" cm":""].filter(Boolean).join(" · ");
  document.getElementById("view").innerHTML = `
    <div class="card">
      <div class="seg" role="group" aria-label="Persona">${["h","e"].map(w=>`<button data-wp="${w}" aria-pressed="${w===who}" style="--c:var(--${w})">${esc(S.people[w].name)}</button>`).join("")}</div>
      <div class="row" style="align-items:flex-end">
        <div class="field" style="flex-basis:100%"><label for="wd">Fecha</label><input type="date" id="wd" value="${today}"></div>
        <div class="field"><label for="wk">Peso (kg)</label><input type="number" id="wk" step="0.1" min="30" max="250" inputmode="decimal" placeholder="82,0"></div>
        <div class="field"><label for="wc">Cintura (cm)</label><input type="number" id="wc" step="0.5" min="40" max="200" inputmode="decimal" placeholder="Opcional"></div>
        <button class="btn" id="wadd" style="flex-basis:100%">Añadir registro</button>
      </div>
      ${wHtml}${cHtml}
      ${all.length?`<h3 class="sec">Registros</h3><ul class="wl">${[...all].reverse().map(x=>`<li><span>${x.d.split("-").reverse().join("/")}</span><span>${fmtE(x)} <button data-del="${x.d}" aria-label="Borrar registro">Borrar</button></span></li>`).join("")}</ul>`:`<p style="color:var(--muted)">Aún no hay registros. Añade el primero para ver la evolución.</p>`}
    </div>${advice}`;
  document.querySelectorAll("[data-wp]").forEach(b=>b.onclick=()=>{ui.wp=b.dataset.wp;render()});
  document.getElementById("wadd").onclick=()=>{
    const d=document.getElementById("wd").value;
    const kg=parseFloat(document.getElementById("wk").value.replace(",","."));
    const cm=parseFloat(document.getElementById("wc").value.replace(",","."));
    const okKg=kg>30&&kg<250, okCm=cm>40&&cm<200;
    if(!d||(!okKg&&!okCm)){alert("Escribe la fecha y al menos el peso o la cintura.");return;}
    const prev=S.weights[who].find(x=>x.d===d)||{d};
    const entry={...prev}; if(okKg) entry.kg=kg; if(okCm) entry.cm=cm;
    S.weights[who]=S.weights[who].filter(x=>x.d!==d).concat(entry); save(); render();
  };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.weights[who]=S.weights[who].filter(x=>x.d!==b.dataset.del);save();render()});
}

function viewSettings(){
  const f = w => { const p=S.people[w]; return `<div class="card" style="border-left:6px solid var(--${w})">
    <div class="row">
      <div class="field"><label for="n-${w}">Nombre</label><input id="n-${w}" value="${esc(p.name)}"></div>
      <div class="field"><label for="k-${w}">Energía (kcal/día)</label><input id="k-${w}" type="number" step="50" min="1200" max="4000" value="${p.kcal}"></div>
      <div class="field"><label for="p-${w}">Proteína (g/día)</label><input id="p-${w}" type="number" step="5" min="40" max="250" value="${p.prot}"></div>
    </div>
    <p style="margin:0;color:var(--muted);font-size:.88rem">${w==="h"
      ? "Punto de partida: ~2150 kcal (déficit moderado de unas 400 kcal) y ~1,8 g de proteína por kg para conservar músculo."
      : "Punto de partida: ~1900 kcal (mantenimiento con entreno de fuerza) y ~1,6 g de proteína por kg. Durante la FIV no conviene hacer déficit."}</p></div>`; };
  document.getElementById("view").innerHTML = `${f("h")}${f("e")}
    <div class="row"><button class="btn" id="saveSet">Guardar cambios</button><button class="btn ghost" id="resetSet">Volver a los valores sugeridos</button></div>
    <div class="card">
      <h3 style="font-size:1.05rem">Copia de seguridad</h3>
      <p style="margin:6px 0 0;color:var(--muted);font-size:.88rem">Los datos se guardan solo en este móvil. Descarga una copia de vez en cuando o para pasarla a otro dispositivo.</p>
      <div class="row"><button class="btn" id="exp">Descargar copia</button><button class="btn ghost" id="imp">Restaurar copia</button></div>
      <input type="file" id="impFile" accept="application/json,.json" hidden>
    </div>
    <div class="card precs">
      <h3>Para el corazón</h3>
      <ul>
        <li>Cocina sin sal añadida y sazona con ajo, limón, hierbas o mojo casero. Las recetas ya evitan embutidos, quesos curados y precocinados.</li>
        <li>Grasa principal: aceite de oliva virgen extra. Pescado azul dos o tres veces por semana.</li>
        <li>Si tomas anticoagulante tipo Sintrom, mantén estables las verduras de hoja verde (espinacas, brócoli) de una semana a otra en lugar de evitarlas, y avisa a tu médico de cambios de dieta.</li>
        <li>Las kcal son orientativas. Tu cardiólogo debe validar el plan, sobre todo si tomas betabloqueantes o diuréticos.</li>
      </ul>
      <h3>Para el hígado, la insulina y el colesterol</h3>
      <ul>
        <li>Tu índice de hígado graso está justo en el límite y la resistencia a la insulina rozándolo, con enzimas hepáticas y glucosa normales. Perder un 7–10 % del peso y reducir cintura mejora ambos. Registra los dos en la pestaña Peso.</li>
        <li>Fuera el alcohol, los refrescos, los zumos y la bollería. El azúcar añadido y la fructosa en bebidas son lo que más grasa acumula en el hígado.</li>
        <li>Cereales integrales, legumbres tres veces por semana y avena: su fibra ayuda a bajar el colesterol LDL.</li>
        <li>Carne roja como mucho dos veces por semana; prioriza pescado, pollo, pavo y legumbres. Un puñado de frutos secos al día.</li>
        <li>Con enfermedad cardiovascular, lo importante es el LDL, no el colesterol total. Pide que incluyan LDL y HDL en la próxima analítica.</li>
      </ul>
      <h3>Para la FIV y un posible embarazo</h3>
      <ul>
        <li>Ácido fólico según lo pautado por su ginecóloga.</li>
        <li>Carne, huevos y pescado siempre bien hechos; nada de crudos ni poco hechos.</li>
        <li>Solo lácteos pasteurizados. Lavar bien frutas y verduras.</li>
        <li>Evitar pez espada, tiburón, atún rojo y lucio por el mercurio. Las recetas usan merluza, bacalao, dorada, salmón y sardinas.</li>
        <li>Cero alcohol y como mucho unos 200 mg de cafeína al día (unos dos cafés).</li>
      </ul>
    </div>`;
  document.getElementById("saveSet").onclick=()=>{
    ["h","e"].forEach(w=>{S.people[w]={name:document.getElementById("n-"+w).value.trim()||DEFAULT.people[w].name,kcal:clamp(+document.getElementById("k-"+w).value||DEFAULT.people[w].kcal,1200,4000),prot:clamp(+document.getElementById("p-"+w).value||DEFAULT.people[w].prot,40,250)}});
    save(); render();
  };
  document.getElementById("exp").onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="menu-semanal-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  };
  const fi=document.getElementById("impFile");
  document.getElementById("imp").onclick=()=>fi.click();
  fi.onchange=async()=>{
    const f=fi.files[0]; if(!f) return;
    try{ const data=JSON.parse(await f.text()); if(!data.week||!data.people) throw 0;
      if(confirm("¿Sustituir los datos actuales por los de la copia?")){ merge(data); save(); render(); status("Copia restaurada"); } }
    catch(e){ alert("El archivo no es una copia válida de esta app."); }
    fi.value="";
  };
  document.getElementById("resetSet").onclick=()=>{["h","e"].forEach(w=>{S.people[w]={...S.people[w],kcal:DEFAULT.people[w].kcal,prot:DEFAULT.people[w].prot}});save();render()};
}

document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;render();window.scrollTo({top:0})});
const THEME_KEY="menu-semanal-tema";
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeSet===t));
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content = t==="dark"?"#12131E":"#FFFFFF";
}
let savedTheme="light"; try{ savedTheme=localStorage.getItem(THEME_KEY)||"light"; }catch(e){}
applyTheme(savedTheme);
document.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>{applyTheme(b.dataset.themeSet); try{localStorage.setItem(THEME_KEY,b.dataset.themeSet)}catch(e){}});
init();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
